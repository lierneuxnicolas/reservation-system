<h1>Shows</h1>

<p><a href="{% url 'show_add' %}">Ajouter un show</a></p>

<ul>
  {% for show in shows %}
    <li>
      <a href="{% url 'show_detail' show.slug %}">{{ show.title }}</a>
      - {{ show.price }} €
      - <a href="{% url 'show_edit' show.slug %}">Modifier</a>
      - <a href="{% url 'show_delete' show.slug %}">Supprimer</a>
    </li>
  {% empty %}
    <li>Aucun show</li>
  {% endfor %}
</ul>
